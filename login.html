<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso al sistema</title>
    <link href="styles/general.css" rel="stylesheet">
    <link href="styles/login.css" rel="stylesheet">
    <script src="scripts/config.js"></script>
    <script src="scripts/loginManager.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body>
    <div class="login-container">
        <h2>Iniciar Sesión</h2>
        <div class="form-group">
            <label>Usuario</label>
            <input class="forms-login" type="text" id="username" required />
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input class="forms-login" type="password" id="password" required />
        </div>
        <button type="button" class="btn-login" onclick="login()">Ingresar</button>

        <div class="footer">
            ¿No tenés cuenta? <a href="#" onclick="showRegisterForm()">Registrate</a>
        </div>
    </div>
</body>

</html>
